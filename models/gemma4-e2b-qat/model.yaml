name: gemma4-e2b-qat

description: Gemma 4 E2B QAT, a quantization-aware trained multimodal (text + vision) instruction-tuned model
model-card-url: https://huggingface.co/unsloth/gemma-4-E2B-it-qat-GGUF
quantization: Q4_K_XL

disk-size: 3440M

capabilities:
  - text
  - vision
  - thinking
  - tools

components:
  - model-e2b-qat-q4-k-xl-gguf
  - mmproj-e2b-qat-bf16-gguf

environment:
  - MMPROJ_FILE=$SNAP_COMPONENTS/mmproj-e2b-qat-bf16-gguf/mmproj-BF16.gguf
  - MODEL_FILE=$SNAP_COMPONENTS/model-e2b-qat-q4-k-xl-gguf/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
  - MODEL_NAME=gemma4-e2b-qat-q4-k-xl


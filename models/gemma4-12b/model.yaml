name: gemma4-12b

description: Gemma 4 12B, a multimodal (text + vision) instruction-tuned model
model-card-url: https://huggingface.co/unsloth/gemma-4-12b-it-GGUF
quantization: Q4_K_M

disk-size: 6959M

capabilities:
  - text
  - vision
  - thinking
  - tools

components:
  - mmproj-12b-bf16-gguf
  - model-12b-q4-k-m-1-of-2
  - model-12b-q4-k-m-2-of-2

environment:
  - MMPROJ_FILE=$SNAP_COMPONENTS/mmproj-12b-bf16-gguf/mmproj-BF16.gguf
  - SHARDS_DIR=/tmp/model-12b-it-q4-k-m-shards
  - MODEL_FILE=$SHARDS_DIR/gemma-4-12b-it-Q4_K_M-00001-of-00002.gguf

layout:
  $SHARDS_DIR/gemma-4-12b-it-Q4_K_M-00001-of-00002.gguf:
    symlink: $SNAP_COMPONENTS/model-12b-q4-k-m-1-of-2/gemma-4-12b-it-Q4_K_M-00001-of-00002.gguf
  $SHARDS_DIR/gemma-4-12b-it-Q4_K_M-00002-of-00002.gguf:
    symlink: $SNAP_COMPONENTS/model-12b-q4-k-m-2-of-2/gemma-4-12b-it-Q4_K_M-00002-of-00002.gguf


name: gemma4-26b-a4b-qat

description: Gemma 4 26B-A4B QAT, a quantization-aware trained multimodal (text + vision) Mixture-of-Experts instruction-tuned model
model-card-url: https://huggingface.co/inference-snaps/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-5GB
quantization: Q4_K_XL

disk-size: 14729M

capabilities:
  - text
  - vision
  - thinking
  - tools

components:
  - mmproj-26b-qat-bf16-gguf
  - model-26b-a4b-qat-q4-k-xl-1-of-3
  - model-26b-a4b-qat-q4-k-xl-2-of-3
  - model-26b-a4b-qat-q4-k-xl-3-of-3

environment:
  - MODEL_NAME=gemma4-26b-a4b-qat-q4-k-xl
  - MMPROJ_FILE=$SNAP_COMPONENTS/mmproj-26b-qat-bf16-gguf/mmproj-BF16.gguf
  - SHARDS_DIR=/tmp/model-26b-a4b-it-qat-q4-k-xl-shards
  - MODEL_FILE=$SHARDS_DIR/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-00001-of-00003.gguf

layout:
  $SHARDS_DIR/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-00001-of-00003.gguf:
    symlink: $SNAP_COMPONENTS/model-26b-a4b-qat-q4-k-xl-1-of-3/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-00001-of-00003.gguf
  $SHARDS_DIR/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-00002-of-00003.gguf:
    symlink: $SNAP_COMPONENTS/model-26b-a4b-qat-q4-k-xl-2-of-3/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-00002-of-00003.gguf
  $SHARDS_DIR/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-00003-of-00003.gguf:
    symlink: $SNAP_COMPONENTS/model-26b-a4b-qat-q4-k-xl-3-of-3/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-00003-of-00003.gguf


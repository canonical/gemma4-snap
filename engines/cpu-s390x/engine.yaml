name: cpu-s390x
summary: CPU option for s390x architectures
description: |
  This engine uses llama.cpp.
  
  It built for the s390x architecture and relies on big endian model files
vendor: Canonical Ltd

devices:
  anyof:
    - type: cpu
      architecture: s390x

runtime: llamacpp

model:
  default: gemma4-e2b-be
  options:
    - gemma4-e2b-be

configurations:
  sleep-idle-seconds: 600
  min-context-size: 4096

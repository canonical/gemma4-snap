# This workflow is used to validate pull requests.
# It includes the Canonical CLA check and engine validation.
name: PR Checks
on: [pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  cla:
    runs-on: ubuntu-slim
    steps:
      - name: Check if CLA signed
        uses: canonical/has-signed-canonical-cla@v2

  lint:
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint package
        # Temporary pin to the CLI commit that adds FastRPC domain matching.
        # Replace with the next canonical CLI release before merging.
        uses: Sinan-Karakaya/inference-snaps-cli/.github/actions/lint-package@c21cbc9
